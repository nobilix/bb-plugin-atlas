# Push to `main`: build and publish to GitHub Pages.
#
# The site is served from `https://nobilix.github.io/bb-plugin-atlas/`, so the
# build reads that address as `SITE_URL`: its origin becomes Astro's `site`,
# its path Astro's `base`, and every internal link carries the prefix. To move
# to a custom domain, set the `SITE_URL` repository variable and add a CNAME.
#
# This does not wait for `verify.yml`: both run on the same push. A bad deploy
# is rolled back by re-running the previous one.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://nobilix.github.io/bb-plugin-atlas' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
